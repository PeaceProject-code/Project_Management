<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Peace Haven</title>
    <link rel="stylesheet" href="../../styles/common/home.css">

        <a href="../../pages/common/login.html" class="ph-back-btn">
