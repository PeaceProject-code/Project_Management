<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Peace Haven</title>
    <link rel="stylesheet" href="../../styles/common/home.css">
    <link rel="stylesheet" href="../../styles/common/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="ph-header">
        <a href="../../pages/common/home.html" class="ph-back-btn">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div class="ph-logo-wrapper">
            <div class="ph-logo">
                <img src="../../assests/images/logo.jpg" alt="Peace Haven Logo">
            </div>
            <div class="ph-brand-name">Peace Haven Corp</div>
        </div>
    </div>

    </div>

    <div class="ph-background"></div>
    <div class="ph-login-wrapper">
        <div class="ph-login-container">
            <!-- Left Section - Login Form -->
            <div class="login-section">
                <div class="login-content">
                    <div class="login-header">
                        <h2 id="loginTitle">Welcome Back!</h2>
                        <p class="role-text" id="roleText">Employee Login</p>
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <div class="input-with-icon">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="email" placeholder="Email Address" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <div class="input-with-icon">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="password" placeholder="Password" required>
                                <i class="fas fa-eye" id="togglePassword"></i>
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" id="rememberMe">
                                Remember Me
                            </label>
                            <a href="#" class="forgot-password">Forgot Password?</a>
                        </div>

                        <button type="submit" class="login-btn">
                            <span>Sign In</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>

                    <div id="errorAlert" class="error-alert">
                        <span id="errorMessage"></span>
                        <button class="close-alert">&times;</button>
                    </div>
                </div>
            </div>

            <!-- Right Section - Welcome Message -->
            <div class="welcome-section">
                <div class="welcome-content">
                    <h1>Peace Haven Portal</h1>
                    <p class="welcome-quote">"Empowering Excellence"</p>
                    
                    <div class="welcome-features">
                        <div class="feature">
                            <i class="fas fa-shield-alt"></i>
                            <p>Secure Workspace Access</p>
                        </div>
                        
                        <div class="feature">
                            <i class="fas fa-users"></i>
                            <p>Team Collaboration</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/common/login.js"></script>
</body>
</html>
